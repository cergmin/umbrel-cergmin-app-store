version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: cergmin-mem0_mem0_1
      APP_PORT: 8000
    
  mem0:
    image: mem0/mem0-api-server:latest
    command: sh -c "pip install psycopg2-binary langchain-neo4j rank-bm25 && exec uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    env_file:
      - path: ${APP_DATA_DIR}/data/.env
    environment:
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      POSTGRES_HOST: cergmin-mem0_pgvector_1
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: it_works_locally
      NEO4J_URI: bolt://cergmin-mem0_neo4j_1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: it_works_locally
    volumes:
      - ${APP_DATA_DIR}/data/mem0/history:/app/history
    depends_on:
      - pgvector
      - neo4j
    restart: on-failure

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/it_works_locally
    volumes:
      - ${APP_DATA_DIR}/data/neo4j:/data
    restart: on-failure

  pgvector:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: it_works_locally
    volumes:
      - ${APP_DATA_DIR}/data/pgvector:/var/lib/postgresql
    restart: on-failure
